<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NIDS Private Network</title>
  <style>
    /* ── Design tokens ──────────────────────────────────────── */
    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --surface2:  #21262d;
      --border:    #30363d;
      --accent:    #58a6ff;
      --accent2:   #3fb950;
      --danger:    #f85149;
      --warning:   #d29922;
      --text:      #c9d1d9;
      --text-dim:  #8b949e;
      --radius:    10px;
      --shadow:    0 4px 24px rgba(0,0,0,.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Top bar ────────────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    header .logo {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: .5px;
    }
    header .logo span { color: var(--text-dim); font-weight: 400; font-size: .85rem; }
    #status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--danger);
      transition: background .3s;
      flex-shrink: 0;
    }
    #status-dot.online { background: var(--accent2); }
    #status-text {
      font-size: .82rem;
      color: var(--text-dim);
    }
    header .spacer { flex: 1; }
    #btn-disconnect {
      display: none;
      padding: 6px 14px;
      background: transparent;
      border: 1px solid var(--danger);
      color: var(--danger);
      border-radius: var(--radius);
      cursor: pointer;
      font-size: .82rem;
      transition: background .2s;
    }
    #btn-disconnect:hover { background: rgba(248,81,73,.15); }

    /* ── Main layout ────────────────────────────────────────── */
    main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ────────────────────────────────────────────── */
    aside {
      width: 220px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }
    .sidebar-title {
      padding: 14px 16px 8px;
      font-size: .7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
    }
    #peer-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    .peer-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 16px;
      font-size: .88rem;
      animation: fadeIn .25s ease;
    }
    .peer-item .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent2);
      flex-shrink: 0;
    }
    .peer-item.me .dot { background: var(--accent); }
    .peer-item.me .name { color: var(--accent); font-weight: 600; }
    .peer-item .name { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .sidebar-info {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      font-size: .78rem;
      color: var(--text-dim);
    }
    .sidebar-info strong { color: var(--text); }

    /* ── Chat area ──────────────────────────────────────────── */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #messages::-webkit-scrollbar { width: 5px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .msg {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: .9rem;
      line-height: 1.5;
      animation: fadeIn .2s ease;
    }
    .msg .meta {
      font-size: .72rem;
      color: var(--text-dim);
      margin-bottom: 4px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .msg .meta .sender { font-weight: 700; color: var(--accent); }
    .msg .meta .sender.me-sender { color: var(--accent2); }
    .msg.incoming { background: var(--surface2); align-self: flex-start; border: 1px solid var(--border); }
    .msg.outgoing { background: rgba(88,166,255,.12); align-self: flex-end; border: 1px solid rgba(88,166,255,.25); }
    .msg.system   {
      background: transparent;
      align-self: center;
      font-size: .78rem;
      color: var(--text-dim);
      padding: 4px 12px;
      border: none;
      font-style: italic;
    }
    .msg.error-msg { background: rgba(248,81,73,.1); border: 1px solid rgba(248,81,73,.3); align-self: center; color: var(--danger); }
    .msg.ack-msg   { background: rgba(63,185,80,.08); border: 1px solid rgba(63,185,80,.25); align-self: center; color: var(--accent2); font-size: .82rem; }
    /* ── File incoming card ──────────────────────────────────── */
    .file-incoming-card {
      display: flex; align-items: center; gap: 12px;
      background: rgba(88,166,255,.08); border: 1px solid rgba(88,166,255,.25);
      border-radius: 8px; padding: 10px 14px; margin-top: 6px;
    }
    .fi-icon  { font-size: 1.8rem; }
    .fi-info  { flex: 1; min-width: 0; }
    .fi-name  { font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fi-size  { font-size: .78rem; color: var(--text-dim); margin-top: 2px; }
    .fi-btn   {
      display: inline-block; padding: 6px 14px; border-radius: 6px;
      background: var(--accent); color: #000; font-weight: 700; font-size: .82rem;
      text-decoration: none; white-space: nowrap;
      transition: background .2s;
    }
    .fi-btn:hover { background: #79b8ff; }

    /* ── Input bar ──────────────────────────────────────────── */
    .input-bar {
      padding: 12px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #msg-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 10px 14px;
      font-size: .9rem;
      outline: none;
      transition: border-color .2s;
    }
    #msg-input:focus { border-color: var(--accent); }
    #msg-input::placeholder { color: var(--text-dim); }

    .icon-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      width: 40px; height: 40px;
      border-radius: var(--radius);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: background .2s, border-color .2s;
      flex-shrink: 0;
    }
    .icon-btn:hover { background: var(--border); border-color: var(--accent); }
    #btn-send {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
      font-weight: 700;
      width: auto;
      padding: 0 18px;
      font-size: .88rem;
    }
    #btn-send:hover { background: #79b8ff; }
    #file-input { display: none; }

    /* ── Login overlay ──────────────────────────────────────── */
    #login-overlay {
      position: fixed;
      inset: 0;
      background: rgba(13,17,23,.97);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(4px);
    }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 36px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow);
      animation: slideUp .3s ease;
    }
    .login-card h1 {
      font-size: 1.4rem;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .login-card p {
      font-size: .82rem;
      color: var(--text-dim);
      margin-bottom: 28px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: .78rem;
      color: var(--text-dim);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .form-group input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 10px 14px;
      font-size: .9rem;
      outline: none;
      transition: border-color .2s;
    }
    .form-group input:focus { border-color: var(--accent); }
    #login-error {
      font-size: .8rem;
      color: var(--danger);
      min-height: 20px;
      margin-bottom: 8px;
    }
    #btn-connect {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s;
      margin-top: 6px;
    }
    #btn-connect:hover { background: #79b8ff; }
    #btn-connect:disabled { background: var(--surface2); color: var(--text-dim); cursor: not-allowed; }

    /* ── File send modal ────────────────────────────────────── */
    #file-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    #file-modal.show { display: flex; }
    .file-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px 32px;
      max-width: 380px;
      width: 100%;
      box-shadow: var(--shadow);
      animation: slideUp .25s ease;
    }
    .file-card h2 { font-size: 1rem; margin-bottom: 16px; color: var(--text); }
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 32px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      color: var(--text-dim);
      font-size: .88rem;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--accent);
      background: rgba(88,166,255,.06);
    }
    .drop-zone .icon { font-size: 2.5rem; margin-bottom: 8px; }
    #selected-file { font-size: .8rem; color: var(--accent2); margin: 10px 0; min-height: 18px; }
    #progress-bar-wrap { display: none; margin-top: 10px; }
    #progress-bar-wrap label { font-size: .75rem; color: var(--text-dim); margin-bottom: 4px; display: block; }
    progress { width: 100%; height: 6px; border-radius: 4px; accent-color: var(--accent); }
    .file-btns { display: flex; gap: 8px; margin-top: 14px; }
    .file-btns button {
      flex: 1; padding: 9px; border-radius: var(--radius);
      cursor: pointer; font-size: .85rem; font-weight: 600;
      border: none; transition: background .2s;
    }
    #btn-file-send { background: var(--accent); color: #000; }
    #btn-file-send:hover { background: #79b8ff; }
    #btn-file-send:disabled { background: var(--surface2); color: var(--text-dim); cursor: not-allowed; }
    #btn-file-cancel { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }

    /* ── Animations ─────────────────────────────────────────── */
    @keyframes fadeIn  { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }

    /* ── Responsive ─────────────────────────────────────────── */
    @media (max-width: 600px) {
      aside { width: 160px; }
      .msg { max-width: 90%; }
      .login-card { padding: 24px 20px; }
    }
  </style>
</head>
<body>

<!-- Login overlay -->
<div id="login-overlay">
  <div class="login-card">
    <h1>NIDS Private Network</h1>
    <p>Connect to the secure private communication network</p>

    <div class="form-group">
      <label>Your Device Alias</label>
      <input id="inp-alias" type="text" placeholder="e.g. Phone-A" maxlength="20" autocomplete="off" />
    </div>
    <div class="form-group">
      <label>Server IP Address</label>
      <input id="inp-ip" type="text" placeholder="192.168.x.x" autocomplete="off" />
    </div>
    <div class="form-group">
      <label>Network Password</label>
      <input id="inp-psk" type="password" placeholder="Network password" autocomplete="off" />
    </div>
    <div class="form-group">
      <label>WebSocket Port</label>
      <input id="inp-port" type="number" value="8444" />
    </div>
    <div id="login-error"></div>
    <button id="btn-connect">Connect</button>
  </div>
</div>

<!-- File send modal -->
<div id="file-modal">
  <div class="file-card">
    <h2>📁 Send a File</h2>
    <div class="drop-zone" id="drop-zone">
      <div class="icon">📂</div>
      <div>Drag &amp; drop a file here<br/>or <u>click to browse</u></div>
      <input type="file" id="file-input" />
    </div>
    <div id="selected-file"></div>
    <div id="progress-bar-wrap">
      <label>Uploading…</label>
      <progress id="progress-bar" max="100" value="0"></progress>
    </div>
    <div class="file-btns">
      <button id="btn-file-send" disabled>Send File</button>
      <button id="btn-file-cancel">Cancel</button>
    </div>
  </div>
</div>

<!-- Top bar -->
<header>
  <div id="status-dot"></div>
  <div class="logo">NIDS-Net <span>Private Network</span></div>
  <div id="status-text">Disconnected</div>
  <div class="spacer"></div>
  <button id="btn-disconnect">Disconnect</button>
</header>

<!-- Main layout -->
<main>
  <!-- Sidebar -->
  <aside>
    <div class="sidebar-title">Online Peers</div>
    <div id="peer-list"></div>
    <div class="sidebar-info">
      <div>Alias: <strong id="my-alias-display">—</strong></div>
      <div style="margin-top:4px">Server: <strong id="server-display">—</strong></div>
    </div>
  </aside>

  <!-- Chat area -->
  <div class="chat-container">
    <div id="messages">
      <div class="msg system">Welcome! Connect to join the network.</div>
    </div>

    <!-- Input bar -->
    <div class="input-bar">
      <input id="msg-input" type="text" placeholder="Type a message…" disabled maxlength="2000" />
      <button class="icon-btn" id="btn-attach" title="Send file" disabled>📎</button>
      <button class="icon-btn" id="btn-peers" title="List peers" disabled>👥</button>
      <button class="icon-btn" id="btn-send" disabled>Send</button>
    </div>
  </div>
</main>

<script>
  /* ── State ────────────────────────────────────────────────── */
  let ws = null;
  let myAlias = '';
  let peers = [];
  let selectedFile = null;

  /* ── DOM refs ─────────────────────────────────────────────── */
  const loginOverlay   = document.getElementById('login-overlay');
  const inpAlias       = document.getElementById('inp-alias');
  const inpIp          = document.getElementById('inp-ip');
  const inpPsk         = document.getElementById('inp-psk');
  const inpPort        = document.getElementById('inp-port');
  const loginError     = document.getElementById('login-error');
  const btnConnect     = document.getElementById('btn-connect');
  const btnDisconnect  = document.getElementById('btn-disconnect');
  const statusDot      = document.getElementById('status-dot');
  const statusText     = document.getElementById('status-text');
  const messages       = document.getElementById('messages');
  const msgInput       = document.getElementById('msg-input');
  const btnSend        = document.getElementById('btn-send');
  const btnAttach      = document.getElementById('btn-attach');
  const btnPeers       = document.getElementById('btn-peers');
  const peerList       = document.getElementById('peer-list');
  const myAliasDisplay = document.getElementById('my-alias-display');
  const serverDisplay  = document.getElementById('server-display');
  const fileModal      = document.getElementById('file-modal');
  const dropZone       = document.getElementById('drop-zone');
  const fileInput      = document.getElementById('file-input');
  const selectedFileEl = document.getElementById('selected-file');
  const progressWrap   = document.getElementById('progress-bar-wrap');
  const progressBar    = document.getElementById('progress-bar');
  const btnFileSend    = document.getElementById('btn-file-send');
  const btnFileCancel  = document.getElementById('btn-file-cancel');

  /* ── Auto-detect server IP ────────────────────────────────── */
  inpIp.value = window.location.hostname || '';

  /* ── HMAC-SHA256 auth token (Web Crypto API) ──────────────── */
  async function computeAuthToken(psk, alias) {
    if (!psk) return '';
    const enc = new TextEncoder();
    const key = await crypto.subtle.importKey(
      'raw', enc.encode(psk),
      { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']
    );
    const sig = await crypto.subtle.sign('HMAC', key, enc.encode(`NIDS-AUTH:${alias}`));
    return Array.from(new Uint8Array(sig)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  /* ── Connect ──────────────────────────────────────────────── */
  btnConnect.addEventListener('click', connect);
  inpAlias.addEventListener('keydown', e => { if (e.key === 'Enter') inpPsk.focus(); });
  inpPsk.addEventListener('keydown',   e => { if (e.key === 'Enter') inpPort.focus(); });
  inpIp.addEventListener('keydown',    e => { if (e.key === 'Enter') inpPort.focus(); });
  inpPort.addEventListener('keydown',  e => { if (e.key === 'Enter') connect(); });

  async function connect() {
    const alias = inpAlias.value.trim();
    const ip    = inpIp.value.trim();
    const psk   = inpPsk.value;
    const port  = parseInt(inpPort.value) || 8444;

    if (!alias)          { showLoginError('Enter a device alias.'); return; }
    if (!/^[A-Za-z0-9_-]{2,20}$/.test(alias)) {
      showLoginError('Alias: 2-20 chars, letters/digits/hyphen/underscore only.');
      return;
    }
    if (!ip)             { showLoginError('Enter the server IP address.'); return; }

    loginError.textContent = '';
    btnConnect.disabled    = true;
    btnConnect.textContent = 'Connecting…';

    myAlias = alias;

    // Always use wss:// (WSS = WebSocket Secure over TLS)
    const url = `wss://${ip}:${port}`;

    // Compute HMAC auth token from password
    const authToken = await computeAuthToken(psk, alias);

    try {
      ws = new WebSocket(url);
    } catch(e) {
      showLoginError('Invalid server address.');
      resetConnectBtn();
      return;
    }

    ws.onopen = () => {
      ws.send(JSON.stringify({ type: 'HELLO', alias, auth_token: authToken }));
    };

    ws.onmessage = e => {
      try { handleMessage(JSON.parse(e.data)); }
      catch(err) { console.warn('Bad JSON from server', err); }
    };

    ws.onerror = () => {
      showLoginError(`Cannot connect to wss://${ip}:${port}. Is the server running?`);
      resetConnectBtn();
      ws = null;
    };

    ws.onclose = () => {
      if (loginOverlay.style.display !== 'none' && loginOverlay.style.display !== '') return;
      setOnline(false);
      appendSystem('Disconnected from server.');
    };
  }

  /* ── Message dispatcher ───────────────────────────────────── */
  function handleMessage(msg) {
    switch (msg.type) {
      case 'WELCOME':
        loginOverlay.style.display = 'none';
        setOnline(true);
        peers = msg.peers || [];
        renderPeers();
        appendSystem(msg.message);
        serverDisplay.textContent = `${inpIp.value}:${inpPort.value}`;
        break;

      case 'BROADCAST':
        appendChat(msg.from, msg.text, msg.time, msg.from === myAlias);
        break;

      case 'PEER_JOIN':
        if (!peers.includes(msg.alias)) peers.push(msg.alias);
        renderPeers();
        appendSystem(`${msg.alias} joined the network`);
        break;

      case 'PEER_LEAVE':
        peers = peers.filter(p => p !== msg.alias);
        renderPeers();
        appendSystem(`${msg.alias} left the network`);
        break;

      case 'ACK':
        appendAck(msg.message);
        break;

      case 'PEER_LIST':
        peers = msg.peers || [];
        renderPeers();
        appendSystem(`Online peers: ${peers.length ? peers.join(', ') : 'none'}`);
        break;

      case 'ERROR':
        appendError(msg.message);
        break;

      case 'FILE_INCOMING':
        receiveFile(msg);
        break;

      case 'DISCONNECT':
        appendSystem(`Server: ${msg.message}`);
        setOnline(false);
        ws = null;
        break;

      case 'PING':
        ws.send(JSON.stringify({ type: 'PONG' }));
        break;
    }
  }

  /* ── Chat send ────────────────────────────────────────────── */
  btnSend.addEventListener('click', sendChat);
  msgInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
  });

  function sendChat() {
    const text = msgInput.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'CHAT', text }));
    msgInput.value = '';
  }

  /* ── Peer list ────────────────────────────────────────────── */
  btnPeers.addEventListener('click', () => {
    if (ws && ws.readyState === WebSocket.OPEN)
      ws.send(JSON.stringify({ type: 'LIST_PEERS' }));
  });

  /* ── Disconnect ───────────────────────────────────────────── */
  btnDisconnect.addEventListener('click', () => {
    if (ws && ws.readyState === WebSocket.OPEN)
      ws.send(JSON.stringify({ type: 'DISCONNECT' }));
    setOnline(false);
    showLogin();
  });

  /* ── File send ────────────────────────────────────────────── */
  btnAttach.addEventListener('click', () => fileModal.classList.add('show'));
  btnFileCancel.addEventListener('click', closeFileModal);
  dropZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => selectFile(e.target.files[0]));

  dropZone.addEventListener('dragover', e => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length) selectFile(e.dataTransfer.files[0]);
  });

  function selectFile(file) {
    if (!file) return;
    const MAX = 100 * 1024 * 1024;
    if (file.size > MAX) {
      selectedFileEl.style.color = 'var(--danger)';
      selectedFileEl.textContent = `File too large (${fmtSize(file.size)}). Max 100 MB.`;
      btnFileSend.disabled = true;
      return;
    }
    selectedFile = file;
    selectedFileEl.style.color = 'var(--accent2)';
    selectedFileEl.textContent = `${file.name}  (${fmtSize(file.size)})`;
    btnFileSend.disabled = false;
  }

  btnFileSend.addEventListener('click', async () => {
    if (!selectedFile || !ws || ws.readyState !== WebSocket.OPEN) return;

    btnFileSend.disabled = true;
    progressWrap.style.display = 'block';

    try {
      const data = await readFileAsBase64(selectedFile, pct => {
        progressBar.value = pct;
      });
      ws.send(JSON.stringify({
        type    : 'FILE',
        filename: selectedFile.name,
        data    : data,
        size    : selectedFile.size,
      }));
      appendSystem(`Sending '${selectedFile.name}'…`);
      closeFileModal();
    } catch(e) {
      appendError(`File read failed: ${e.message}`);
      closeFileModal();
    }
  });

  function readFileAsBase64(file, onProgress) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onprogress = e => { if (e.lengthComputable) onProgress(Math.round(e.loaded/e.total*100)); };
      reader.onload    = e => resolve(e.target.result.split(',')[1]);
      reader.onerror   = ()  => reject(new Error('Read error'));
      reader.readAsDataURL(file);
    });
  }

  function receiveFile(msg) {
    // Trigger a browser download for a file sent by another client
    try {
      const bytes = Uint8Array.from(atob(msg.data), c => c.charCodeAt(0));
      const blob  = new Blob([bytes]);
      const url   = URL.createObjectURL(blob);
      const a     = document.createElement('a');
      a.href      = url;
      a.download  = msg.filename;
      a.click();
      URL.revokeObjectURL(url);
      appendAck(`File received: ${msg.filename} from ${msg.from}`);
    } catch(e) {
      appendError(`File receive error: ${e.message}`);
    }
  }

  function closeFileModal() {
    fileModal.classList.remove('show');
    selectedFile    = null;
    fileInput.value = '';
    selectedFileEl.textContent   = '';
    progressWrap.style.display   = 'none';
    progressBar.value            = 0;
    btnFileSend.disabled         = true;
  }

  /* ── UI helpers ───────────────────────────────────────────── */
  function setOnline(online) {
    statusDot.className = online ? 'online' : '';
    statusText.textContent = online ? `Connected as ${myAlias}` : 'Disconnected';
    btnDisconnect.style.display = online ? 'block' : 'none';
    myAliasDisplay.textContent  = online ? myAlias : '—';
    [msgInput, btnSend, btnAttach, btnPeers].forEach(el => el.disabled = !online);
    if (online) msgInput.focus();
  }

  function showLogin() {
    loginOverlay.style.display = 'flex';
    resetConnectBtn();
    peers = [];
    renderPeers();
    serverDisplay.textContent = '—';
  }

  function resetConnectBtn() {
    btnConnect.disabled    = false;
    btnConnect.textContent = 'Connect';
  }

  function showLoginError(msg) {
    loginError.textContent = msg;
  }

  function renderPeers() {
    peerList.innerHTML = '';
    // Show myself first
    const me = document.createElement('div');
    me.className = 'peer-item me';
    me.innerHTML = `<div class="dot"></div><div class="name">${escHtml(myAlias)} (you)</div>`;
    peerList.appendChild(me);
    peers.forEach(p => {
      const el = document.createElement('div');
      el.className = 'peer-item';
      el.innerHTML = `<div class="dot"></div><div class="name">${escHtml(p)}</div>`;
      peerList.appendChild(el);
    });
  }

  function appendChat(sender, text, time, isMe) {
    const el = document.createElement('div');
    el.className = `msg ${isMe ? 'outgoing' : 'incoming'}`;
    el.innerHTML =
      `<div class="meta">
        <span class="sender ${isMe ? 'me-sender' : ''}">${escHtml(sender)}</span>
        <span>${escHtml(time || now())}</span>
       </div>
       <div>${escHtml(text)}</div>`;
    appendMsg(el);
  }

  function appendSystem(text) {
    const el = document.createElement('div');
    el.className = 'msg system';
    el.textContent = text;
    appendMsg(el);
  }

  function appendAck(text) {
    const el = document.createElement('div');
    el.className = 'msg ack-msg';
    el.textContent = '[OK] ' + text;
    appendMsg(el);
  }

  function appendError(text) {
    const el = document.createElement('div');
    el.className = 'msg error-msg';
    el.textContent = '[!] ' + text;
    appendMsg(el);
  }

  function appendMsg(el) {
    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function now() {
    return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  }

  function fmtSize(b) {
    if (b < 1024)     return b + ' B';
    if (b < 1048576)  return (b/1024).toFixed(1) + ' KB';
    return (b/1048576).toFixed(2) + ' MB';
  }
  /* ── Receive file from any peer (creates download card) ────── */
  function receiveFile(msg) {
    try {
      // Decode base64 → Uint8Array → Blob
      const binary = atob(msg.data);
      const bytes  = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      const blob = new Blob([bytes]);
      const url  = URL.createObjectURL(blob);

      const el = document.createElement('div');
      el.className = 'msg incoming file-card-msg';
      el.innerHTML =
        `<div class="meta">
           <span class="sender">📎 ${escHtml(msg.from)}</span>
           <span>${now()}</span>
         </div>
         <div class="file-incoming-card">
           <div class="fi-icon">📄</div>
           <div class="fi-info">
             <div class="fi-name">${escHtml(msg.filename)}</div>
             <div class="fi-size">${fmtSize(msg.size || bytes.length)}</div>
           </div>
           <a class="fi-btn" href="${url}" download="${escHtml(msg.filename)}">
             ⬇ Download
           </a>
         </div>`;
      appendMsg(el);
    } catch(e) {
      appendError(`Could not decode incoming file '${msg.filename}': ${e}`);
    }
  }

</script>
</body>
</html>
